<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TRU PCI DSS v4.0.1 — Evidence Command Center</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#f0f2f5;color:#1a1a2e;font-size:13px;overflow-x:hidden}
/* HEADER */
.hdr{background:linear-gradient(135deg,#1F3864,#2E75B6);color:#fff;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.ht h1{font-size:16px;font-weight:700}.ht p{font-size:10px;opacity:.75;margin-top:2px}
.sb{display:flex;gap:8px;align-items:center}
.sbox{background:rgba(255,255,255,.15);border-radius:8px;padding:5px 12px;text-align:center}
.sbox .n{font-size:18px;font-weight:700}.sbox .l{font-size:9px;opacity:.8;text-transform:uppercase}
.op{font-size:24px;font-weight:700;color:#4FC3F7}
/* TOOLBAR */
.ctrl{background:#fff;padding:8px 20px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;position:sticky;top:0;z-index:200;border-bottom:2px solid #e0e4ea;box-shadow:0 2px 6px rgba(0,0,0,.08)}
.ctrl label{font-size:10px;font-weight:700;color:#666;text-transform:uppercase}
.fb{padding:3px 10px;border:1px solid #dde1ea;border-radius:12px;background:#f8f9fb;cursor:pointer;font-size:11px;font-weight:600;color:#555;white-space:nowrap}
.fb.active{background:#1F3864;color:#fff;border-color:#1F3864}
.fb.fc.active{background:#28a745;border-color:#28a745}
.fb.fn.active{background:#dc3545;border-color:#dc3545}
.sb2{padding:4px 10px;border:1px solid #dde1ea;border-radius:12px;font-size:12px;outline:none;min-width:200px}
.ea{padding:3px 9px;border:1px solid #dde1ea;border-radius:5px;background:#f0f6ff;cursor:pointer;font-size:11px;font-weight:600;color:#2E75B6}
/* MAIN LAYOUT */
.layout{display:flex;height:calc(100vh - 100px)}
.list-pane{flex:1;overflow-y:auto;padding:14px 18px;min-width:0}
/* PREVIEW PANEL */
.preview-pane{width:520px;min-width:350px;background:#fff;border-left:2px solid #d8e8f8;display:flex;flex-direction:column;position:relative}
.preview-pane.hidden{display:none}
.ph{background:#EBF3FF;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #d8e8f8;flex-shrink:0}
.ph h3{font-size:12px;font-weight:700;color:#1F3864;word-break:break-all;max-width:380px}
.pc{flex:1;overflow:auto;padding:0}
.pc iframe{width:100%;height:100%;border:none}
.pc img{max-width:100%;max-height:100%;display:block;margin:auto;padding:12px}
.pc .docx-body{padding:20px;font-size:12px;line-height:1.7;color:#222}
.pc .docx-body h1,.pc .docx-body h2{color:#1F3864;margin:16px 0 8px}
.pc .docx-body p{margin-bottom:8px}
.pc .docx-body table{border-collapse:collapse;width:100%;margin:10px 0;font-size:11px}
.pc .docx-body td,.pc .docx-body th{border:1px solid #ccc;padding:5px 8px}
.pc .docx-body th{background:#EBF3FF;font-weight:700}
.pc .no-preview{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:#888;text-align:center;gap:12px;padding:30px}
.pc .no-preview .big{font-size:48px}
.pc .no-preview a{color:#2E75B6;font-weight:700;text-decoration:none;padding:6px 16px;border:1px solid #2E75B6;border-radius:6px}
.close-btn{background:rgba(220,53,69,.8);color:#fff;border:none;border-radius:4px;padding:2px 9px;cursor:pointer;font-size:13px;font-weight:700}
.resize-handle{width:5px;background:#d8e8f8;cursor:col-resize;flex-shrink:0}
.resize-handle:hover{background:#2E75B6}
/* REQUIREMENTS */
.rb{background:#fff;border-radius:10px;margin-bottom:10px;box-shadow:0 1px 4px rgba(0,0,0,.07);overflow:hidden}
.rh{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;cursor:pointer;gap:10px;user-select:none}
.rh:hover{background:#f0f6ff}
.rl{display:flex;align-items:center;gap:8px}
.rn{background:#1F3864;color:#fff;border-radius:5px;padding:2px 8px;font-size:11px;font-weight:700}
.rname{font-size:13px;font-weight:700;color:#1F3864}
.rr{display:flex;align-items:center;gap:7px;flex-shrink:0;flex-wrap:wrap}
.rpct{font-size:13px;font-weight:700;color:#2E75B6;min-width:34px;text-align:right}
.rbar{width:80px;height:6px;background:#e0e4ea;border-radius:3px;overflow:hidden}
.ti{font-size:11px;color:#999}
.rbody{display:none;border-top:1px solid #e8eaed}
.rbody.open{display:block}
/* OWNER TAG */
.owner-tag{font-size:9px;font-weight:700;padding:1px 6px;border-radius:4px;color:#fff;margin-left:6px}
/* TABLE */
.et{width:100%;border-collapse:collapse}
.et thead th{background:#EBF3FF;padding:6px 10px;text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.4px;color:#2E75B6;font-weight:700;border-bottom:1px solid #d8e8f8}
.et tbody tr{border-bottom:1px solid #f4f5f7}
.et tbody tr:hover{background:#fafbff}
.et tbody tr.hidden{display:none}
.tc{padding:7px 10px;font-size:13px;font-weight:700;color:#2E75B6;white-space:nowrap;vertical-align:top}
.td{padding:7px 10px;font-size:11px;color:#444;vertical-align:top;line-height:1.5}
.ts{padding:7px 10px;vertical-align:top}
.tf{padding:7px 10px;vertical-align:top}
.to{padding:7px 10px;vertical-align:top;font-size:10px}
.fl{display:flex;flex-direction:column;gap:4px}
.fi{display:flex;align-items:center;gap:6px;padding:3px 7px;border-radius:5px;cursor:pointer;border:1px solid #e0e8f4;background:#f8faff;transition:.15s}
.fi:hover{background:#ddeeff;border-color:#2E75B6}
.fi:active{background:#c8e0ff}
.fn{font-size:11px;color:#1F3864;font-weight:600;flex:1;word-break:break-all}
.fk{font-size:10px;color:#aaa;white-space:nowrap}
.fl.empty{font-size:11px;color:#c0392b;font-style:italic;padding:4px 0}
/* BADGES */
.badge{display:inline-block;padding:2px 8px;border-radius:9px;font-size:10px;font-weight:700;white-space:nowrap;margin:1px}
.b-complete{background:#d4edda;color:#155724}
.b-partial{background:#fff3cd;color:#856404}
.b-pending{background:#f8d7da;color:#721c24}
/* COMMENT */
.comment-area{padding:10px 16px;border-top:1px solid #d8e8f8;background:#f8faff;flex-shrink:0}
.comment-area h4{font-size:10px;color:#666;text-transform:uppercase;margin-bottom:6px}
.comment-list{max-height:100px;overflow-y:auto;margin-bottom:6px}
.comment-item{font-size:11px;color:#444;padding:3px 0;border-bottom:1px solid #eee}
.comment-item .ca{font-weight:700;color:#1F3864;margin-right:4px}
.comment-item .ct{font-size:9px;color:#aaa;margin-left:4px}
.comment-form{display:flex;gap:4px}
.comment-input{flex:1;padding:4px 8px;border:1px solid #dde1ea;border-radius:6px;font-size:11px;outline:none}
.comment-input:focus{border-color:#2E75B6}
.comment-submit{padding:4px 10px;border:none;background:#1F3864;color:#fff;border-radius:6px;font-size:11px;font-weight:700;cursor:pointer}
.comment-submit:hover{background:#2E75B6}
/* REVIEW ACTIONS */
.review-actions{padding:8px 16px;border-top:1px solid #d8e8f8;background:#fff;flex-shrink:0;display:flex;gap:6px;align-items:center}
.rev-btn{padding:5px 14px;border-radius:8px;font-size:11px;font-weight:700;cursor:pointer;border:1px solid transparent;transition:.15s}
.rev-btn.approve{background:#d4edda;color:#155724;border-color:#c3e6cb}
.rev-btn.approve:hover,.rev-btn.approve.active{background:#28a745;color:#fff}
.rev-btn.flag{background:#fff3cd;color:#856404;border-color:#ffeeba}
.rev-btn.flag:hover,.rev-btn.flag.active{background:#e6a817;color:#fff}
.rev-btn.reject{background:#f8d7da;color:#721c24;border-color:#f5c6cb}
.rev-btn.reject:hover,.rev-btn.reject.active{background:#dc3545;color:#fff}
.rev-status{margin-left:auto;font-size:10px;font-weight:700;text-transform:uppercase}
@media print{.ctrl,.preview-pane,.resize-handle,.comment-area,.review-actions{display:none}.rbody{display:block!important}.rb{box-shadow:none;border:1px solid #ddd;page-break-inside:avoid}body{background:#fff}.list-pane{height:auto;overflow:visible}}
</style>
</head>
<body>

<div class="hdr">
  <div class="ht">
    <h1>&#x1F6E1;&#xFE0F; TRU PCI DSS v4.0.1 — Evidence Command Center</h1>
    <p>iExperts &middot; TRU Compliance &middot; Live Data &middot; Click any evidence file to preview</p>
  </div>
  <div class="sb" id="headerStats"></div>
</div>

<div class="ctrl">
  <label>Filter:</label>
  <div id="filterBtns"></div>
  <input class="sb2" type="text" placeholder="&#x1F50D; Search EP # or description..." oninput="ss(this.value)">
  <button class="ea" onclick="ea()">Expand All</button>
  <button class="ea" onclick="ca()">Collapse All</button>
  <button class="ea" onclick="window.print()" style="background:#1F3864;color:#fff;border-color:#1F3864">&#x1F5A8;&#xFE0F; Print</button>
  <button class="ea" onclick="exportCSV()" style="background:#28a745;color:#fff;border-color:#28a745">&#x1F4E5; Export CSV</button>
</div>

<div class="layout">
  <div class="list-pane" id="listPane"></div>
  <div id="resizeHandle" class="resize-handle"></div>
  <div class="preview-pane hidden" id="previewPane">
    <div class="ph">
      <h3 id="previewTitle">File Preview</h3>
      <button class="close-btn" onclick="closePreview()">&#x2715;</button>
    </div>
    <div class="pc" id="previewContent"></div>
    <div class="review-actions" id="reviewActions" style="display:none">
      <button class="rev-btn approve" onclick="setReview('approved')">&#x2705; Approve</button>
      <button class="rev-btn flag" onclick="setReview('flagged')">&#x26A0;&#xFE0F; Flag</button>
      <button class="rev-btn reject" onclick="setReview('rejected')">&#x274C; Reject</button>
      <span class="rev-status" id="revStatus"></span>
    </div>
    <div class="comment-area" id="commentArea" style="display:none">
      <h4>Comments</h4>
      <div class="comment-list" id="commentList"></div>
      <div class="comment-form">
        <input class="comment-input" id="commentInput" placeholder="Add a comment..." onkeydown="if(event.key==='Enter')addComment()">
        <button class="comment-submit" onclick="addComment()">Send</button>
      </div>
    </div>
  </div>
</div>

<script>
// ===== EMBEDDED DATA =====
var DATA = __DATA_PLACEHOLDER__;

var currentFilter = 'all';
var currentEpId = null;
var reviewStates = {};
var comments = {};

// Load persisted review states
try { reviewStates = JSON.parse(localStorage.getItem('tru_reviews') || '{}'); } catch(e) {}
try { comments = JSON.parse(localStorage.getItem('tru_comments') || '{}'); } catch(e) {}

function saveRS() { try { localStorage.setItem('tru_reviews', JSON.stringify(reviewStates)); } catch(e) {} }
function saveComments() { try { localStorage.setItem('tru_comments', JSON.stringify(comments)); } catch(e) {} }

// ===== OWNER MAP =====
var OWNERS = DATA.owners || {};
function getOwner(reqId) {
  for (var name in OWNERS) {
    if (OWNERS[name].reqs && OWNERS[name].reqs.indexOf(reqId) > -1) {
      return { name: name.split(' ')[0], color: OWNERS[name].color, role: OWNERS[name].role };
    }
  }
  return { name: '?', color: '#666', role: 'Unassigned' };
}

// ===== BUILD HEADER =====
function buildHeader() {
  var s = DATA.summary || {};
  var h = document.getElementById('headerStats');
  h.innerHTML =
    '<div class="sbox"><div class="n">' + (s.filledEPs||0) + '</div><div class="l">Filled</div></div>' +
    '<div class="sbox"><div class="n" style="color:#ffc">' + (s.emptyEPs||0) + '</div><div class="l">Empty</div></div>' +
    '<div class="sbox"><div class="n">' + (s.totalEPs||0) + '</div><div class="l">Total EPs</div></div>' +
    '<div class="sbox"><div class="n">' + (s.reqsAt100||0) + '</div><div class="l">Reqs@100%</div></div>' +
    '<div class="sbox"><div class="op">' + (s.percentage||0) + '%</div><div class="l">Coverage</div></div>';
}

// ===== BUILD FILTERS =====
function buildFilters() {
  var s = DATA.summary || {};
  var el = document.getElementById('filterBtns');
  el.innerHTML =
    '<button class="fb active" onclick="sf(\'all\',this)">All (' + (s.totalEPs||0) + ')</button> ' +
    '<button class="fb fc" onclick="sf(\'complete\',this)">&#x2705; Filled (' + (s.filledEPs||0) + ')</button> ' +
    '<button class="fb fn" onclick="sf(\'pending\',this)">&#x1F534; Empty (' + (s.emptyEPs||0) + ')</button>';
}

// ===== BUILD REQUIREMENT SECTIONS =====
function buildRequirements() {
  var reqs = DATA.requirements || [];
  var eps = DATA.evidencePoints || [];
  var pane = document.getElementById('listPane');
  pane.innerHTML = '';

  reqs.forEach(function(req) {
    var reqEps = eps.filter(function(ep) { return ep.requirement === req.id; });
    var owner = getOwner(req.id);

    // Determine bar color
    var barColor = req.percentage === 100 ? '#28a745' : req.percentage >= 50 ? '#e6a817' : '#dc3545';

    var div = document.createElement('div');
    div.className = 'rb';
    div.id = 'r' + req.id;

    // Header
    div.innerHTML =
      '<div class="rh" onclick="tog(' + req.id + ')">' +
        '<div class="rl">' +
          '<span class="rn">REQ ' + req.id + '</span>' +
          '<span class="rname">' + esc(req.name) + '</span>' +
          '<span class="owner-tag" style="background:' + owner.color + '">' + esc(owner.name) + '</span>' +
        '</div>' +
        '<div class="rr">' +
          '<span class="badge b-complete">' + req.filled + ' &#x2705;</span>' +
          '<span class="badge b-pending">' + req.empty + ' &#x1F534;</span>' +
          '<span class="rpct">' + req.percentage + '%</span>' +
          '<div class="rbar"><div style="width:' + req.percentage + '%;height:100%;background:' + barColor + ';border-radius:3px"></div></div>' +
          '<span class="ti" id="ti' + req.id + '">&#x25BC;</span>' +
        '</div>' +
      '</div>';

    // Body table
    var body = document.createElement('div');
    body.className = 'rbody';
    body.id = 'rb' + req.id;

    var table = '<table class="et"><thead><tr>' +
      '<th style="width:50px">EP#</th>' +
      '<th>Description</th>' +
      '<th style="width:80px">Owner</th>' +
      '<th style="width:80px">Status</th>' +
      '<th>Evidence Files (click to preview)</th>' +
    '</tr></thead><tbody>';

    reqEps.forEach(function(ep) {
      var status = ep.hasFiles ? 'complete' : 'pending';
      // Check if there's a local review override
      if (reviewStates[ep.id]) status = reviewStates[ep.id] === 'approved' ? 'complete' : (reviewStates[ep.id] === 'flagged' ? 'partial' : 'pending');
      var statusBadge = status === 'complete' ? '<span class="badge b-complete">&#x2705; Filled</span>' :
                        status === 'partial' ? '<span class="badge b-partial">&#x26A0;&#xFE0F; Flagged</span>' :
                        '<span class="badge b-pending">&#x1F534; Empty</span>';

      var epOwner = getOwner(ep.requirement);
      var epNum = ep.epId || ep.id;
      // Extract 3-digit number from folder name if possible
      var numMatch = (ep.folder || '').match(/^(\d{3})/);
      var displayNum = numMatch ? numMatch[1] : epNum;

      var filesHtml;
      if (ep.hasFiles && ep.files && ep.files.length > 0) {
        filesHtml = '<div class="fl">';
        ep.files.forEach(function(f) {
          var ext = (f.ext || '').replace('.', '');
          var icon = ext === 'pdf' ? '&#x1F4D5;' : ext === 'xlsx' || ext === 'xls' ? '&#x1F4CA;' : '&#x1F4C4;';
          var sizeStr = f.size ? formatSize(f.size) : '';
          filesHtml += '<div class="fi" onclick="openFile(\'' + escAttr(ep.folder) + '/' + escAttr(f.name) + '\',\'' + ext + '\',\'' + escAttr(f.name) + '\',\'' + escAttr(ep.id) + '\')" title="Click to preview">' +
            icon + ' <span class="fn">' + esc(f.name) + '</span><span class="fk">' + sizeStr + '</span></div>';
        });
        filesHtml += '</div>';
      } else if (ep.hasFiles) {
        // has files but no file details
        filesHtml = '<div class="fl"><div class="fi" style="cursor:default"><span class="fn" style="color:#28a745">&#x2705; Evidence uploaded</span></div></div>';
      } else {
        filesHtml = '<div class="fl empty">No evidence uploaded yet</div>';
      }

      table += '<tr class="erow ' + status + '" data-ep="' + displayNum + '" data-id="' + escAttr(ep.id) + '">' +
        '<td class="tc">' + displayNum + '</td>' +
        '<td class="td">' + esc(ep.folder || '') + '</td>' +
        '<td class="to"><span class="owner-tag" style="background:' + epOwner.color + '">' + esc(epOwner.name) + '</span></td>' +
        '<td class="ts">' + statusBadge + '</td>' +
        '<td class="tf">' + filesHtml + '</td>' +
      '</tr>';
    });

    table += '</tbody></table>';
    body.innerHTML = table;
    div.appendChild(body);
    pane.appendChild(div);
  });
}

// ===== TOGGLE REQUIREMENT =====
function tog(id) {
  var b = document.getElementById('rb' + id);
  var t = document.getElementById('ti' + id);
  if (b.classList.contains('open')) {
    b.classList.remove('open');
    if (t) t.innerHTML = '&#x25BC;';
  } else {
    b.classList.add('open');
    if (t) t.innerHTML = '&#x25B2;';
  }
}

// ===== FILTER =====
function sf(f, btn) {
  currentFilter = f;
  document.querySelectorAll('.ctrl .fb').forEach(function(b) { b.classList.remove('active'); });
  if (btn) btn.classList.add('active');
  applyFilters();
}
function ss(v) { applyFilters(v); }

function applyFilters(q) {
  var flt = currentFilter;
  var ql = (q || document.querySelector('.sb2').value || '').toLowerCase().trim();
  document.querySelectorAll('.erow').forEach(function(r) {
    var ep = (r.getAttribute('data-ep') || '');
    var desc = (r.querySelector('.td') || {}).textContent || '';
    var matchQ = !ql || ep.indexOf(ql) > -1 || desc.toLowerCase().indexOf(ql) > -1;
    var matchF = flt === 'all' || r.classList.contains(flt);
    r.classList.toggle('hidden', !(matchQ && matchF));
  });
  if (ql) {
    document.querySelectorAll('.rbody').forEach(function(b) {
      var vis = b.querySelectorAll('.erow:not(.hidden)');
      var id = b.id.replace('rb', '');
      var ti = document.getElementById('ti' + id);
      if (vis.length > 0) { b.classList.add('open'); if (ti) ti.innerHTML = '&#x25B2;'; }
    });
  }
}

function ea() {
  document.querySelectorAll('.rbody').forEach(function(b) { b.classList.add('open'); });
  document.querySelectorAll('.ti').forEach(function(t) { t.innerHTML = '&#x25B2;'; });
}
function ca() {
  document.querySelectorAll('.rbody').forEach(function(b) { b.classList.remove('open'); });
  document.querySelectorAll('.ti').forEach(function(t) { t.innerHTML = '&#x25BC;'; });
}

// ===== FILE PREVIEW =====
function openFile(relPath, ext, name, epId) {
  currentEpId = epId;
  var pane = document.getElementById('previewPane');
  var content = document.getElementById('previewContent');
  var title = document.getElementById('previewTitle');
  pane.classList.remove('hidden');
  title.textContent = name;
  content.innerHTML = '';
  document.getElementById('reviewActions').style.display = 'flex';
  document.getElementById('commentArea').style.display = 'block';

  // Update review status display
  updateRevStatus();
  renderComments();

  var imgExts = ['jpg','jpeg','png','gif','bmp','webp','svg'];

  if (ext === 'pdf') {
    var iframe = document.createElement('iframe');
    iframe.src = '/evidence/' + relPath + '#toolbar=1&navpanes=0';
    iframe.style.cssText = 'width:100%;height:100%;border:none';
    iframe.onerror = function() { content.innerHTML = '<div class="no-preview"><div class="big">&#x1F4D5;</div><p><strong>' + esc(name) + '</strong></p><p style="font-size:11px;color:#888">PDF preview not available on server.</p></div>'; };
    content.appendChild(iframe);
  } else if (imgExts.indexOf(ext) > -1) {
    var img = document.createElement('img');
    img.src = '/evidence/' + relPath;
    img.style.cssText = 'max-width:100%;max-height:100%;display:block;margin:auto;padding:16px';
    img.onerror = function() { content.innerHTML = '<div class="no-preview"><div class="big">&#x26A0;&#xFE0F;</div><p>Could not load image</p></div>'; };
    content.appendChild(img);
  } else if (ext === 'docx' || ext === 'doc') {
    content.innerHTML = '<div class="no-preview"><div class="big">&#x1F4C4;</div><p><strong>' + esc(name) + '</strong></p><p style="font-size:11px;color:#888;max-width:300px">Word documents open best in Microsoft Word or Google Docs.</p><p style="font-size:10px;color:#aaa;margin-top:6px">File is in the Google Drive evidence folder</p></div>';
  } else if (ext === 'xlsx' || ext === 'xls' || ext === 'csv') {
    content.innerHTML = '<div class="no-preview"><div class="big">&#x1F4CA;</div><p><strong>' + esc(name) + '</strong></p><p style="font-size:11px;color:#888">Excel files open best in Excel.</p></div>';
  } else {
    content.innerHTML = '<div class="no-preview"><div class="big">&#x1F4CE;</div><p><strong>' + esc(name) + '</strong></p><p style="font-size:11px;color:#888">This file type opens in its native application.</p></div>';
  }
}

function closePreview() {
  document.getElementById('previewPane').classList.add('hidden');
  currentEpId = null;
}

// ===== REVIEW =====
function setReview(status) {
  if (!currentEpId) return;
  reviewStates[currentEpId] = status;
  saveRS();
  updateRevStatus();
  // Update the row badge
  var row = document.querySelector('[data-id="' + currentEpId + '"]');
  if (row) {
    row.className = 'erow ' + (status === 'approved' ? 'complete' : status === 'flagged' ? 'partial' : 'pending');
    var badge = row.querySelector('.ts');
    if (badge) {
      badge.innerHTML = status === 'approved' ? '<span class="badge b-complete">&#x2705; Approved</span>' :
                        status === 'flagged' ? '<span class="badge b-partial">&#x26A0;&#xFE0F; Flagged</span>' :
                        '<span class="badge b-pending">&#x274C; Rejected</span>';
    }
  }
  // Try to POST to server
  try {
    fetch('/api/review/' + currentEpId, {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ status: status, reviewer_name: 'iExperts Reviewer' })
    }).catch(function(){});
  } catch(e) {}
}

function updateRevStatus() {
  var el = document.getElementById('revStatus');
  var s = reviewStates[currentEpId];
  if (s === 'approved') { el.textContent = '&#x2705; APPROVED'; el.style.color = '#28a745'; }
  else if (s === 'flagged') { el.textContent = '&#x26A0; FLAGGED'; el.style.color = '#e6a817'; }
  else if (s === 'rejected') { el.textContent = '&#x274C; REJECTED'; el.style.color = '#dc3545'; }
  else { el.textContent = 'PENDING REVIEW'; el.style.color = '#888'; }
  // Highlight active button
  document.querySelectorAll('.rev-btn').forEach(function(b) { b.classList.remove('active'); });
  if (s) {
    var cls = s === 'approved' ? '.approve' : s === 'flagged' ? '.flag' : '.reject';
    var btn = document.querySelector('.rev-btn' + cls);
    if (btn) btn.classList.add('active');
  }
}

// ===== COMMENTS =====
function renderComments() {
  var list = document.getElementById('commentList');
  var epComments = comments[currentEpId] || [];
  list.innerHTML = '';
  epComments.forEach(function(c) {
    var d = document.createElement('div');
    d.className = 'comment-item';
    d.innerHTML = '<span class="ca">' + esc(c.author) + '</span>' + esc(c.text) + '<span class="ct">' + c.time + '</span>';
    list.appendChild(d);
  });
  list.scrollTop = list.scrollHeight;
}

function addComment() {
  var input = document.getElementById('commentInput');
  var text = input.value.trim();
  if (!text || !currentEpId) return;
  if (!comments[currentEpId]) comments[currentEpId] = [];
  var now = new Date();
  comments[currentEpId].push({
    author: 'Reviewer',
    text: text,
    time: now.toLocaleDateString() + ' ' + now.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})
  });
  saveComments();
  renderComments();
  input.value = '';
  // Try to POST to server
  try {
    fetch('/api/comments', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ evidence_point_id: currentEpId, comment: text, author: 'iExperts Reviewer' })
    }).catch(function(){});
  } catch(e) {}
}

// ===== EXPORT CSV =====
function exportCSV() {
  var eps = DATA.evidencePoints || [];
  var rows = [['EP_ID','Requirement','Folder','Type','Has_Files','File_Count','Owner','Review_Status']];
  eps.forEach(function(ep) {
    var o = getOwner(ep.requirement);
    var rs = reviewStates[ep.id] || ep.reviewStatus || 'pending';
    rows.push([ep.epId, 'R' + ep.requirement, '"' + (ep.folder||'').replace(/"/g,'""') + '"', ep.type, ep.hasFiles?'Yes':'No', ep.fileCount, o.name, rs]);
  });
  var csv = rows.map(function(r){return r.join(',')}).join('\n');
  var blob = new Blob([csv], {type:'text/csv'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'TRU_PCI_DSS_Evidence_Report_' + new Date().toISOString().split('T')[0] + '.csv';
  a.click();
}

// ===== RESIZE HANDLE =====
var resizing = false, startX, startW;
var handle = document.getElementById('resizeHandle');
var pane = document.getElementById('previewPane');
handle.addEventListener('mousedown', function(e) {
  resizing = true; startX = e.clientX;
  startW = pane.offsetWidth;
  document.body.style.userSelect = 'none';
  document.body.style.cursor = 'col-resize';
});
document.addEventListener('mousemove', function(e) {
  if (!resizing) return;
  var dx = startX - e.clientX;
  var newW = Math.max(300, Math.min(900, startW + dx));
  pane.style.width = newW + 'px';
});
document.addEventListener('mouseup', function() {
  resizing = false;
  document.body.style.userSelect = '';
  document.body.style.cursor = '';
});

// ===== HELPERS =====
function esc(s) { var d=document.createElement('div'); d.textContent=s||''; return d.innerHTML; }
function escAttr(s) { return (s||'').replace(/'/g,"\\'").replace(/"/g,'&quot;'); }
function formatSize(b) {
  if (b < 1024) return b + ' B';
  if (b < 1048576) return Math.round(b/1024) + ' KB';
  return (b/1048576).toFixed(1) + ' MB';
}

// ===== INIT =====
buildHeader();
buildFilters();
buildRequirements();
</script>
