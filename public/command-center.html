<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TRU PCI DSS v4.0 | Command Center</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
:root {
  --bg-primary:#0a0e1a;--bg-secondary:#111827;--bg-card:#1a2236;--bg-card-hover:#1f2942;
  --bg-sidebar:#0d1225;--border:#2a3550;--border-light:#334155;
  --text-primary:#f1f5f9;--text-secondary:#94a3b8;--text-muted:#64748b;
  --accent-blue:#3b82f6;--accent-cyan:#06b6d4;--accent-green:#10b981;--accent-emerald:#34d399;
  --accent-yellow:#f59e0b;--accent-orange:#f97316;--accent-red:#ef4444;--accent-purple:#8b5cf6;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:'Inter',system-ui,-apple-system,sans-serif;background:var(--bg-primary);color:var(--text-primary);min-height:100vh;overflow-x:hidden;display:flex}

/* SIDEBAR */
.sidebar{width:260px;min-height:100vh;background:var(--bg-sidebar);border-right:1px solid var(--border);display:flex;flex-direction:column;position:fixed;top:0;left:0;z-index:200;overflow-y:auto}
.sidebar-logo{padding:20px 24px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--border)}
.logo-icon{width:42px;height:42px;background:linear-gradient(135deg,var(--accent-blue),var(--accent-cyan));border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:14px;color:#fff;box-shadow:0 0 24px rgba(59,130,246,.35)}
.logo-text{font-size:15px;font-weight:700;letter-spacing:-.3px}
.logo-sub{font-size:10px;color:var(--text-muted);font-weight:500;letter-spacing:.5px;text-transform:uppercase}
.sidebar-nav{padding:16px 12px;flex:1}
.nav-section{font-size:10px;color:var(--text-muted);font-weight:600;text-transform:uppercase;letter-spacing:1px;padding:12px 12px 6px}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 14px;margin:2px 0;border-radius:8px;cursor:pointer;transition:all .15s;font-size:13px;font-weight:500;color:var(--text-secondary);border:1px solid transparent}
.nav-item:hover{background:rgba(59,130,246,.08);color:var(--text-primary)}
.nav-item.active{background:linear-gradient(135deg,rgba(59,130,246,.15),rgba(6,182,212,.08));color:#fff;font-weight:600;border-color:rgba(59,130,246,.2)}
.nav-item .icon{font-size:16px;width:22px;text-align:center}
.nav-item .badge{margin-left:auto;background:var(--accent-red);color:#fff;font-size:10px;font-weight:700;padding:2px 7px;border-radius:10px}
.sidebar-footer{padding:16px 20px;border-top:1px solid var(--border);font-size:11px;color:var(--text-muted)}
.scan-date{font-size:10px;color:var(--accent-cyan);font-weight:600}

/* MAIN */
.main-area{margin-left:260px;flex:1;min-height:100vh}
.topbar{background:linear-gradient(135deg,#0f1b33,#162040,#1a1040);border-bottom:1px solid var(--border);padding:0 32px;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;backdrop-filter:blur(12px)}
.topbar-title{font-size:15px;font-weight:700}
.topbar-right{display:flex;align-items:center;gap:12px}
.sprint-badge{background:linear-gradient(135deg,var(--accent-yellow),#d97706);color:#000;padding:5px 14px;border-radius:20px;font-weight:700;font-size:11px;letter-spacing:.5px;animation:pulse-glow 2s infinite}
@keyframes pulse-glow{0%,100%{box-shadow:0 0 8px rgba(245,158,11,.3)}50%{box-shadow:0 0 20px rgba(245,158,11,.5)}}
.btn-export{background:linear-gradient(135deg,var(--accent-blue),var(--accent-cyan));color:#fff;border:none;padding:6px 16px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;transition:all .2s;font-family:inherit}
.btn-export:hover{transform:translateY(-1px);box-shadow:0 4px 15px rgba(59,130,246,.4)}
.content{padding:24px 32px 48px}

/* KPIs */
.kpi-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:14px;margin-bottom:24px}
.kpi-card{background:var(--bg-card);border:1px solid var(--border);border-radius:14px;padding:18px;position:relative;overflow:hidden;transition:all .2s}
.kpi-card:hover{transform:translateY(-2px);border-color:var(--accent-blue)}
.kpi-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px}
.kpi-card.blue::before{background:linear-gradient(90deg,var(--accent-blue),var(--accent-cyan))}
.kpi-card.green::before{background:linear-gradient(90deg,var(--accent-green),var(--accent-emerald))}
.kpi-card.yellow::before{background:linear-gradient(90deg,var(--accent-yellow),var(--accent-orange))}
.kpi-card.red::before{background:linear-gradient(90deg,var(--accent-red),#f87171)}
.kpi-card.purple::before{background:linear-gradient(90deg,var(--accent-purple),#a78bfa)}
.kpi-card.cyan::before{background:linear-gradient(90deg,var(--accent-cyan),#22d3ee)}
.kpi-value{font-size:30px;font-weight:800;line-height:1;margin-bottom:4px}
.kpi-label{font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.8px;font-weight:600}
.kpi-delta{font-size:11px;font-weight:600;margin-top:4px}
.kpi-delta.up{color:var(--accent-green)}.kpi-delta.down{color:var(--accent-red)}

/* PROGRESS */
.progress-section{background:var(--bg-card);border:1px solid var(--border);border-radius:14px;padding:18px 24px;margin-bottom:24px}
.progress-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.progress-title{font-size:12px;color:var(--text-secondary);font-weight:600;text-transform:uppercase;letter-spacing:.8px}
.progress-value{font-size:26px;font-weight:800;color:var(--accent-green)}
.progress-track{height:26px;background:#1e293b;border-radius:13px;overflow:hidden;position:relative}
.progress-fill{height:100%;border-radius:13px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;color:#000;transition:width 1.5s cubic-bezier(.4,0,.2,1);background:linear-gradient(90deg,#10b981,#34d399,#6ee7b7);box-shadow:0 0 20px rgba(16,185,129,.4)}
.progress-remaining{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:11px;color:var(--text-muted)}

/* LAYOUTS */
.grid-2{display:grid;grid-template-columns:2fr 1fr;gap:20px;margin-bottom:24px}
.card{background:var(--bg-card);border:1px solid var(--border);border-radius:14px;padding:20px;overflow:hidden}
.card-title{font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.8px;font-weight:600;margin-bottom:14px}

/* TABLE */
.req-table{width:100%;border-collapse:collapse}
.req-table th{text-align:left;padding:8px 10px;font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:1px;border-bottom:1px solid var(--border)}
.req-table td{padding:9px 10px;font-size:13px;border-bottom:1px solid rgba(42,53,80,.4)}
.req-table tr{transition:background .15s;cursor:pointer}
.req-table tr:hover{background:var(--bg-card-hover)}
.mini-bar{height:7px;background:#1e293b;border-radius:4px;overflow:hidden;width:110px}
.mini-fill{height:100%;border-radius:4px;transition:width 1s ease}
.status-tag{display:inline-block;padding:2px 10px;border-radius:10px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.status-tag.complete{background:rgba(16,185,129,.15);color:var(--accent-green)}
.status-tag.near{background:rgba(245,158,11,.12);color:var(--accent-yellow)}
.status-tag.progress{background:rgba(59,130,246,.12);color:var(--accent-blue)}
.status-tag.behind{background:rgba(239,68,68,.12);color:var(--accent-red)}

/* OWNERS */
.owner-card{display:flex;align-items:center;gap:12px;padding:12px;background:var(--bg-primary);border-radius:10px;margin-bottom:8px;transition:all .15s}
.owner-card:hover{background:rgba(59,130,246,.05)}
.owner-avatar{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;color:#fff}
.owner-info{flex:1}
.owner-name{font-weight:600;font-size:13px}
.owner-role{font-size:11px;color:var(--text-muted)}
.owner-stats{text-align:right}
.owner-count{font-size:20px;font-weight:800}
.owner-label{font-size:10px;color:var(--text-muted)}

/* DONUT */
.donut-container{display:flex;align-items:center;justify-content:center;padding:12px 0}
.donut-legend{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:8px}
.legend-item{display:flex;align-items:center;gap:6px;font-size:11px}
.legend-dot{width:10px;height:10px;border-radius:3px}

/* TIMELINE */
.timeline{padding-left:20px;border-left:2px solid var(--border)}
.timeline-item{position:relative;padding:0 0 14px 0}
.timeline-item::before{content:'';position:absolute;left:-27px;top:3px;width:12px;height:12px;border-radius:50%}
.timeline-item.done::before{background:var(--accent-green)}
.timeline-item.current::before{background:var(--accent-yellow);box-shadow:0 0 8px var(--accent-yellow)}
.timeline-item.future::before{background:var(--border);border:2px solid var(--text-muted)}
.timeline-date{font-size:10px;color:var(--text-muted);font-weight:600}
.timeline-text{font-size:13px}

/* ALERT */
.alert-banner{border-radius:14px;padding:14px 20px;margin-bottom:24px;display:flex;align-items:center;gap:14px;font-size:13px}
.alert-banner.warning{background:linear-gradient(135deg,rgba(245,158,11,.1),rgba(249,115,22,.05));border:1px solid rgba(245,158,11,.2)}
.alert-banner.info{background:linear-gradient(135deg,rgba(59,130,246,.1),rgba(6,182,212,.05));border:1px solid rgba(59,130,246,.2)}
.alert-icon{font-size:20px}
.alert-text strong{color:var(--accent-yellow)}

/* REVIEWER */
.reviewer-toolbar{background:var(--bg-card);border:1px solid var(--border);border-radius:14px;padding:14px 18px;margin-bottom:18px;display:flex;flex-wrap:wrap;align-items:center;gap:10px;position:sticky;top:56px;z-index:50;backdrop-filter:blur(12px)}
.filter-pills{display:flex;gap:5px;flex-wrap:wrap}
.pill{padding:5px 12px;border-radius:20px;font-size:11px;font-weight:600;cursor:pointer;transition:all .2s;border:1px solid var(--border);background:transparent;color:var(--text-secondary);letter-spacing:.3px;font-family:inherit}
.pill:hover{border-color:var(--accent-blue);color:var(--text-primary)}
.pill.active{background:var(--accent-blue);border-color:var(--accent-blue);color:#fff}
.pill .cnt{background:rgba(255,255,255,.15);padding:1px 5px;border-radius:8px;font-size:9px;margin-left:3px}
.pill.active .cnt{background:rgba(255,255,255,.25)}
.search-box{flex:1;min-width:180px;background:var(--bg-primary);border:1px solid var(--border);border-radius:10px;padding:7px 14px;color:var(--text-primary);font-size:12px;font-family:inherit}
.search-box::placeholder{color:var(--text-muted)}
.search-box:focus{outline:none;border-color:var(--accent-blue);box-shadow:0 0 0 3px rgba(59,130,246,.12)}

.reviewer-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
.rev-stat{background:var(--bg-card);border:1px solid var(--border);border-radius:12px;padding:14px;text-align:center}
.rev-stat .val{font-size:26px;font-weight:800}
.rev-stat .lbl{font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.8px;margin-top:2px}
.rev-stat.green .val{color:var(--accent-green)}
.rev-stat.yellow .val{color:var(--accent-yellow)}
.rev-stat.red .val{color:var(--accent-red)}
.rev-stat.blue .val{color:var(--accent-blue)}

/* REQ SECTIONS */
.req-section{background:var(--bg-card);border:1px solid var(--border);border-radius:14px;margin-bottom:14px;overflow:hidden}
.req-section-header{display:flex;align-items:center;gap:14px;padding:14px 18px;cursor:pointer;transition:background .15s}
.req-section-header:hover{background:var(--bg-card-hover)}
.req-num{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;color:#fff}
.req-section-info{flex:1}
.req-section-name{font-weight:600;font-size:13px}
.req-section-progress{font-size:11px;color:var(--text-secondary);margin-top:2px}
.req-section-bar{width:180px;height:6px;background:#1e293b;border-radius:3px;overflow:hidden}
.req-section-fill{height:100%;border-radius:3px}
.req-section-badges{display:flex;gap:6px}
.badge-count{font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px}
.badge-count.filled{background:rgba(16,185,129,.12);color:var(--accent-green)}
.badge-count.empty-b{background:rgba(239,68,68,.1);color:var(--accent-red)}
.badge-count.reviewed{background:rgba(59,130,246,.12);color:var(--accent-blue)}
.chevron{color:var(--text-muted);font-size:14px;transition:transform .2s;padding:0 6px}
.req-section.open .chevron{transform:rotate(90deg)}

/* EP CARDS */
.ep-list{padding:0 10px 10px;display:none}
.req-section.open .ep-list{display:block}
.ep-card{background:var(--bg-primary);border:1px solid var(--border);border-radius:10px;margin:6px;padding:12px 14px;display:flex;align-items:flex-start;gap:12px;transition:all .2s;border-left:4px solid var(--border)}
.ep-card:hover{border-color:rgba(59,130,246,.3);background:rgba(59,130,246,.02)}
.ep-card.has-files{border-left-color:var(--accent-green)}
.ep-card.empty-ep{border-left-color:var(--accent-red);opacity:.75}
.ep-card.approved{border-left-color:var(--accent-emerald);background:rgba(16,185,129,.02)}
.ep-card.flagged{border-left-color:var(--accent-orange);background:rgba(249,115,22,.02)}
.ep-checkbox{margin-top:2px}
.ep-checkbox input{width:15px;height:15px;cursor:pointer;accent-color:var(--accent-blue)}
.ep-main{flex:1;min-width:0}
.ep-title{font-size:12px;font-weight:600;margin-bottom:3px;word-wrap:break-word;line-height:1.4}
.ep-id{font-size:10px;color:var(--accent-cyan);font-weight:700;margin-right:6px}
.ep-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:5px}
.ep-tag{font-size:9px;font-weight:600;padding:2px 7px;border-radius:5px;display:flex;align-items:center;gap:3px}
.ep-tag.type{background:rgba(139,92,246,.12);color:var(--accent-purple)}
.ep-tag.files{background:rgba(16,185,129,.12);color:var(--accent-green)}
.ep-tag.empty-tag{background:rgba(239,68,68,.1);color:var(--accent-red)}
.ep-tag.size{background:rgba(6,182,212,.1);color:var(--accent-cyan)}
.ep-tag.approved-tag{background:rgba(16,185,129,.12);color:var(--accent-green)}
.ep-tag.flagged-tag{background:rgba(245,158,11,.1);color:var(--accent-yellow)}
.ep-files{margin-top:6px}
.ep-file{display:flex;align-items:center;gap:6px;padding:3px 6px;font-size:11px;color:var(--text-secondary);border-radius:4px}
.ep-file:hover{background:rgba(59,130,246,.04)}
.ep-file .fname{flex:1;word-break:break-all}.ep-file .fsize{color:var(--text-muted);font-size:10px}
.ep-actions{display:flex;flex-direction:column;gap:5px;align-items:flex-end}
.review-btns{display:flex;gap:3px}
.review-btn{padding:4px 10px;border-radius:6px;font-size:10px;font-weight:700;cursor:pointer;transition:all .15s;border:1px solid transparent;text-transform:uppercase;letter-spacing:.4px;font-family:inherit;background:transparent}
.review-btn.approve{color:var(--accent-green);border-color:rgba(16,185,129,.2)}
.review-btn.approve:hover,.review-btn.approve.active{background:var(--accent-green);color:#000}
.review-btn.flag{color:var(--accent-yellow);border-color:rgba(245,158,11,.2)}
.review-btn.flag:hover,.review-btn.flag.active{background:var(--accent-yellow);color:#000}
.comment-input{width:160px;background:var(--bg-card);border:1px solid var(--border);border-radius:6px;padding:3px 7px;color:var(--text-primary);font-size:10px;font-family:inherit}
.comment-input::placeholder{color:var(--text-muted)}
.comment-input:focus{outline:none;border-color:var(--accent-blue)}

/* REPORTS */
.report-actions{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:24px}
.report-btn{background:var(--bg-card);border:1px solid var(--border);border-radius:12px;padding:20px;cursor:pointer;transition:all .2s;flex:1;min-width:200px}
.report-btn:hover{border-color:var(--accent-blue);transform:translateY(-2px)}
.report-btn .r-icon{font-size:26px;margin-bottom:6px}
.report-btn .r-title{font-weight:700;font-size:14px;margin-bottom:3px}
.report-btn .r-desc{font-size:11px;color:var(--text-muted)}

/* BULK BAR */
.bulk-bar{position:fixed;bottom:24px;left:50%;transform:translateX(calc(-50% + 130px));background:var(--accent-blue);border-radius:14px;padding:10px 20px;display:none;align-items:center;gap:14px;z-index:300;box-shadow:0 8px 32px rgba(0,0,0,.5)}
.bulk-bar.visible{display:flex}
.bulk-count{font-weight:700;font-size:13px}
.bulk-btn{padding:5px 14px;border-radius:8px;font-size:11px;font-weight:700;cursor:pointer;border:none;transition:all .15s;font-family:inherit}
.bulk-btn.b-approve{background:var(--accent-green);color:#000}
.bulk-btn.b-flag{background:var(--accent-yellow);color:#000}
.bulk-btn.b-clear{background:rgba(255,255,255,.2);color:#fff}

/* ANIMATIONS */
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.anim{animation:fadeIn .4s ease-out}
.d1{animation-delay:.05s;animation-fill-mode:both}.d2{animation-delay:.1s;animation-fill-mode:both}
.d3{animation-delay:.15s;animation-fill-mode:both}.d4{animation-delay:.2s;animation-fill-mode:both}
.d5{animation-delay:.25s;animation-fill-mode:both}.d6{animation-delay:.3s;animation-fill-mode:both}

/* RESPONSIVE */
@media(max-width:1200px){.kpi-grid{grid-template-columns:repeat(3,1fr)}.grid-2{grid-template-columns:1fr}}
@media(max-width:900px){.sidebar{display:none}.main-area{margin-left:0}.kpi-grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>

<div class="sidebar" id="sidebar"></div>
<div class="main-area">
  <div class="topbar">
    <div class="topbar-title" id="viewTitle">Dashboard</div>
    <div class="topbar-right">
      <span class="sprint-badge">DAY 5 OF SPRINT</span>
      <button class="btn-export" onclick="exportReviewReport()">&#x1F4E4; Export Report</button>
    </div>
  </div>
  <div class="content" id="viewContent"></div>
</div>

<div class="bulk-bar" id="bulkBar">
  <span class="bulk-count"><span id="bulkCount">0</span> selected</span>
  <button class="bulk-btn b-approve" onclick="bulkAction('approved')">Approve All</button>
  <button class="bulk-btn b-flag" onclick="bulkAction('flagged')">Flag All</button>
  <button class="bulk-btn b-clear" onclick="clearSelection()">Clear</button>
</div>

<script>
// ===== EMBEDDED DATA =====
var DATA = __DATA_PLACEHOLDER__;

// ===== STATE =====
var state = {
  view: 'dashboard', filter: 'all', filterReq: null, search: '',
  selected: new Set(), reviewStates: loadRS()
};

// ===== COLORS =====
var REQ_COLORS = {1:'#3b82f6',2:'#10b981',3:'#f59e0b',4:'#06b6d4',5:'#f97316',6:'#8b5cf6',7:'#10b981',8:'#ef4444',9:'#06b6d4',10:'#ef4444',11:'#f97316',12:'#10b981'};
function rc(id){return REQ_COLORS[id]||'#64748b'}

// ===== HELPERS =====
function fmtSize(b){if(b<1024)return b+' B';if(b<1048576)return(b/1024).toFixed(1)+' KB';return(b/1048576).toFixed(1)+' MB'}
function fmtDate(iso){return new Date(iso).toLocaleDateString('en-US',{month:'short',day:'numeric'})}
function fIcon(ext){var m={'.docx':'\u{1F4C4}','.doc':'\u{1F4C4}','.xlsx':'\u{1F4CA}','.pdf':'\u{1F4D5}','.png':'\u{1F5BC}','.jpg':'\u{1F5BC}','.txt':'\u{1F4DD}','.csv':'\u{1F4CB}'};return m[ext]||'\u{1F4CE}'}
function getRS(id){return(state.reviewStates[id]||{}).status||'pending'}
function setRS(id,s,c){if(!state.reviewStates[id])state.reviewStates[id]={};state.reviewStates[id].status=s;state.reviewStates[id].date=new Date().toISOString();state.reviewStates[id].reviewer='Yasser Shishiny';if(c!==undefined)state.reviewStates[id].comment=c;saveRS()}
function loadRS(){try{var s=localStorage.getItem('tru_pci_rs');return s?JSON.parse(s):{}}catch(e){return{}}}
function saveRS(){try{localStorage.setItem('tru_pci_rs',JSON.stringify(state.reviewStates))}catch(e){}}
function getCounts(){var a=0,f=0,nr=0,em=0;DATA.evidencePoints.forEach(function(ep){var r=getRS(ep.id);if(!ep.hasFiles){em++;return}if(r==='approved')a++;else if(r==='flagged')f++;else nr++});return{approved:a,flagged:f,needsReview:nr,empty:em}}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

// ===== SIDEBAR =====
function buildSidebar(){
  var s=DATA.summary;

// ===== VIEWS =====
function switchView(v){
  state.view=v;
  document.querySelectorAll('.nav-item[data-view]').forEach(function(el){el.classList.toggle('active',el.dataset.view===v)});
  var titles={dashboard:'Dashboard',reviewer:'Evidence Reviewer',reports:'Reports & Export'};
  document.getElementById('viewTitle').textContent=titles[v]||'Dashboard';
  render();
}

function render(){
  var c=document.getElementById('viewContent');
  if(state.view==='dashboard')renderDash(c);
  else if(state.view==='reviewer')renderReviewer(c);
  else if(state.view==='reports')renderReports(c);
}

function filterByReq(id){
  state.filterReq=id;state.filter='all';render();
  setTimeout(function(){
    var s=document.getElementById('req-section-'+id);
    if(s){s.classList.add('open');s.scrollIntoView({behavior:'smooth',block:'start'})}
  },100);
}

function renderReviewer(el){
  var rc2=getCounts();
  var h='<div class="reviewer-stats anim">';
  h+='<div class="rev-stat green"><div class="val">'+rc2.approved+'</div><div class="lbl">Approved</div></div>';
  h+='<div class="rev-stat yellow"><div class="val">'+rc2.needsReview+'</div><div class="lbl">Needs Review</div></div>';
  h+='<div class="rev-stat red"><div class="val">'+rc2.empty+'</div><div class="lbl">Empty / Missing</div></div>';
  var coverage=(rc2.approved+rc2.needsReview)>0?Math.round(rc2.approved/(rc2.approved+rc2.needsReview)*100):0;
  h+='<div class="rev-stat blue"><div class="val">'+coverage+'%</div><div class="lbl">Review Coverage</div></div>';
  h+='</div>';

  h+='<div class="reviewer-toolbar anim"><div class="filter-pills">';
  var filters=[['all','All',DATA.summary.totalEPs],['has_files','Has Files',DATA.summary.filledEPs],['approved','\u2705 Approved',rc2.approved],['needs_review','\u{1F50D} Needs Review',rc2.needsReview],['flagged','\u26A0 Flagged',rc2.flagged],['empty','\u274C Empty',rc2.empty]];
  filters.forEach(function(f){
    h+='<button class="pill'+(state.filter===f[0]?' active':'')+'" onclick="setFilter(\''+f[0]+'\')">'+f[1]+'<span class="cnt">'+f[2]+'</span></button>';
  });

  h+='</div>';

  h+='</div>';

  h+='<div id="reqSections">'+buildSections()+'</div>';

function setFilter(f){state.filter=f;render()}

function buildSections(){
  var reqs=state.filterReq?DATA.requirements.filter(function(r){return r.id===state.filterReq}):DATA.requirements.sort(function(a,b){return a.id-b.id});
  var h='';
  reqs.forEach(function(req){
    var eps=DATA.evidencePoints.filter(function(ep){return ep.requirement===req.id});
    // Filter
    eps=eps.filter(function(ep){
      var rs=getRS(ep.id);
      if(state.filter==='has_files')return ep.hasFiles;
      if(state.filter==='approved')return ep.hasFiles&&rs==='approved';
      if(state.filter==='needs_review')return ep.hasFiles&&rs!=='approved'&&rs!=='flagged';
      if(state.filter==='flagged')return rs==='flagged';
      if(state.filter==='empty')return!ep.hasFiles;
      return true;
    });
    // Search
    if(state.search){
      var q=state.search.toLowerCase();
      eps=eps.filter(function(ep){return ep.folder.toLowerCase().indexOf(q)>=0||ep.id.toLowerCase().indexOf(q)>=0||ep.files.some(function(f){return f.name.toLowerCase().indexOf(q)>=0})});
    }
    if(eps.length===0&&!state.filterReq)return;

    var filled=eps.filter(function(ep){return ep.hasFiles}).length;
    var approved=eps.filter(function(ep){return getRS(ep.id)==='approved'}).length;
    var isOpen=state.filterReq?true:false;

    h+='<div class="req-section'+(isOpen?' open':'')+'" id="req-section-'+req.id+'">';
    h+='<div class="req-section-header" onclick="this.parentElement.classList.toggle(\'open\')">';
    h+='<div class="req-num" style="background:'+rc(req.id)+'">'+req.id+'</div>';
    h+='<div class="req-section-info"><div class="req-section-name">Requirement '+req.id+' \u2013 '+req.name+'</div>';
    h+='<div class="req-section-progress">'+filled+'/'+eps.length+' populated \u2022 '+approved+' approved</div></div>';
    var pct=eps.length?Math.round(filled/eps.length*100):0;
    h+='<div class="req-section-bar"><div class="req-section-fill" style="width:'+pct+'%;background:'+rc(req.id)+'"></div></div>';
    h+='<div class="req-section-badges"><span class="badge-count filled">'+filled+' filled</span>';
    if(eps.length-filled>0)h+='<span class="badge-count empty-b">'+(eps.length-filled)+' empty</span>';
    if(approved>0)h+='<span class="badge-count reviewed">'+approved+' reviewed</span>';
    h+='</div><div class="chevron">\u25B6</div></div>';

    h+='<div class="ep-list">';
    eps.forEach(function(ep){h+=buildEPCard(ep)});
    h+='</div></div>';
  });
  return h;
}

function updateSections(){document.getElementById('reqSections').innerHTML=buildSections()}

function buildEPCard(ep){
  var rs=getRS(ep.id);
  var comment=(state.reviewStates[ep.id]||{}).comment||'';
  var cls=!ep.hasFiles?'empty-ep':rs==='approved'?'approved':rs==='flagged'?'flagged':'has-files';
  var checked=state.selected.has(ep.id)?'checked':'';

  var h='<div class="ep-card '+cls+'" id="ep-'+ep.id+'">';
  h+='<div class="ep-checkbox"><input type="checkbox" '+checked+' onchange="toggleSel(\''+ep.id+'\',this.checked)"></div>';
  h+='<div class="ep-main"><div class="ep-title"><span class="ep-id">'+ep.id+'</span>'+esc(ep.folder)+'</div>';
  h+='<div class="ep-meta"><span class="ep-tag type">'+ep.type+'</span>';
  if(ep.hasFiles){
    h+='<span class="ep-tag files">\u{1F4C1} '+ep.fileCount+' file'+(ep.fileCount>1?'s':'')+'</span>';
    h+='<span class="ep-tag size">'+fmtSize(ep.totalSize)+'</span>';
  }else{
    h+='<span class="ep-tag empty-tag">\u274C No files</span>';
  }
  if(rs==='approved')h+='<span class="ep-tag approved-tag">\u2705 Approved</span>';
  if(rs==='flagged')h+='<span class="ep-tag flagged-tag">\u26A0 Flagged</span>';
  h+='</div>';

  if(ep.hasFiles){
    h+='<div class="ep-files">';
    ep.files.forEach(function(f){
      h+='<div class="ep-file"><span>'+fIcon(f.ext)+'</span><span class="fname">'+esc(f.name)+'</span><span class="fsize">'+fmtSize(f.size)+'</span></div>';
    });
    h+='</div>';
  }
  h+='</div>';

  h+='<div class="ep-actions">';
  if(ep.hasFiles){
    h+='<div class="review-btns">';
    h+='<button class="review-btn approve'+(rs==='approved'?' active':'')+'" onclick="reviewEP(\''+ep.id+'\',\'approved\')">\u2705 OK</button>';
    h+='<button class="review-btn flag'+(rs==='flagged'?' active':'')+'" onclick="reviewEP(\''+ep.id+'\',\'flagged\')">\u26A0 Flag</button>';
    h+='</div>';
  }
  h+='<input type="text" class="comment-input" placeholder="Add comment..." value="'+esc(comment)+'" onchange="setComment(\''+ep.id+'\',this.value)">';
  h+='</div></div>';
  return h;
}

function reviewEP(id,s){var c=getRS(id);setRS(id,c===s?'pending':s);render()}
function setComment(id,c){if(!state.reviewStates[id])state.reviewStates[id]={status:'pending'};state.reviewStates[id].comment=c;saveRS()}
function toggleSel(id,chk){if(chk)state.selected.add(id);else state.selected.delete(id);document.getElementById('bulkBar').classList.toggle('visible',state.selected.size>0);document.getElementById('bulkCount').textContent=state.selected.size}
function clearSelection(){state.selected.clear();document.getElementById('bulkBar').classList.remove('visible');render()}
function bulkAction(s){state.selected.forEach(function(id){setRS(id,s)});state.selected.clear();document.getElementById('bulkBar').classList.remove('visible');render()}

      h+='<tr><td style="font-weight:600">'+ep.id+'</td><td style="font-size:12px">'+esc(ep.folder)+'</td>';
      h+='<td>'+(ep.hasFiles?ep.files.map(function(f){return esc(f.name)}).join('<br>'):'\u2014')+'</td>';
      h+='<td>'+st+'</td><td style="font-size:11px;color:#64748b">'+esc(comment)+'</td></tr>';
    });
    h+='</tbody></table>';
  });
  h+='<div class="footer">Generated by TRU PCI DSS Command Center | '+now.toISOString()+' | Confidential</div></body></html>';
  downloadFile('TRU_PCI_DSS_Review_Report_'+now.toISOString().split('T')[0]+'.html',h,'text/html');
}

function exportCSV(){
  var csv='Requirement,EP ID,Folder,Type,HasFiles,FileCount,Files,Size,Owner,ReviewStatus,Comment\n';
  DATA.evidencePoints.sort(function(a,b){return a.requirement-b.requirement}).forEach(function(ep){
    var rs=getRS(ep.id);var c=((state.reviewStates[ep.id]||{}).comment||'').replace(/"/g,'""');
    var files=ep.files.map(function(f){return f.name}).join('; ');
    csv+=ep.requirement+',"'+ep.id+'","'+ep.folder.replace(/"/g,'""')+'",'+ep.type+','+ep.hasFiles+','+ep.fileCount+',"'+files+'",'+ep.totalSize+',"'+ep.owner+'",'+rs+',"'+c+'"\n';
  });
  downloadFile('TRU_PCI_DSS_Evidence_Matrix.csv',csv,'text/csv');
}

function exportEmptyList(){
  var byOwner={};

  });
  var h='<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Missing Evidence Checklist</title><style>body{font-family:"Segoe UI",system-ui,sans-serif;margin:40px auto;max-width:900px;color:#1e293b}h1{color:#dc2626;border-bottom:3px solid #dc2626;padding-bottom:12px}.os{background:#fef2f2;border:1px solid #fecaca;border-radius:8px;padding:16px;margin:16px 0}.on{font-size:18px;font-weight:700;color:#dc2626}.or{font-size:13px;color:#64748b}.cl{list-style:none;padding:0;margin:12px 0}.cl li{padding:8px 12px;border-bottom:1px solid #fecaca;font-size:13px;display:flex;gap:8px}.cb{width:16px;height:16px;border:2px solid #dc2626;border-radius:3px;flex-shrink:0;margin-top:2px}.rl{font-weight:700;color:#1e3a5f;min-width:50px}.ft{margin-top:40px;padding-top:16px;border-top:2px solid #e2e8f0;font-size:11px;color:#94a3b8;text-align:center}</style></head><body>';
  h+='<h1>\u26A0 Missing Evidence Checklist</h1><p style="color:#64748b">Generated: '+new Date().toLocaleDateString('en-US',{weekday:'long',year:'numeric',month:'long',day:'numeric'})+' | '+DATA.summary.emptyEPs+' items remaining</p>';
  Object.entries(byOwner).sort(function(a,b){return b[1].length-a[1].length}).forEach(function(entry){
    var name=entry[0],eps=entry[1];var info=DATA.owners[name]||{role:'Team Member'};
    h+='<div class="os"><div class="on">'+name+' ('+eps.length+' items)</div><div class="or">'+info.role+'</div><ul class="cl">';
    eps.sort(function(a,b){return a.requirement-b.requirement}).forEach(function(ep){
      h+='<li><div class="cb"></div><span class="rl">R'+ep.requirement+'</span>'+esc(ep.folder)+'</li>';
    });
    h+='</ul></div>';
  });
  h+='<div class="ft">TRU PCI DSS v4.0 | Missing Evidence Checklist | Confidential</div></body></html>';
  downloadFile('TRU_PCI_DSS_Missing_Evidence_Checklist.html',h,'text/html');
