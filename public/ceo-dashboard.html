<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TRU PCI DSS v4.0.1 | CEO Dashboard</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',system-ui,sans-serif;background:#f0f4f8;color:#1e293b;line-height:1.6;min-height:100vh}

/* Header */
.header{background:linear-gradient(135deg,#0f172a 0%,#1e3a5f 50%,#0ea5e9 100%);padding:36px 48px 32px;color:#fff;position:relative;overflow:hidden}
.header::before{content:'';position:absolute;top:-50%;right:-10%;width:500px;height:500px;background:radial-gradient(circle,rgba(14,165,233,.25) 0%,transparent 70%);border-radius:50%}
.header::after{content:'';position:absolute;bottom:-40%;left:15%;width:400px;height:400px;background:radial-gradient(circle,rgba(99,102,241,.15) 0%,transparent 70%);border-radius:50%}
.header-inner{position:relative;z-index:1;max-width:1400px;margin:0 auto;display:flex;justify-content:space-between;align-items:flex-end}
.header-left{}
.header .label{font-size:11px;font-weight:600;letter-spacing:3px;text-transform:uppercase;color:#7dd3fc;margin-bottom:6px}
.header h1{font-size:28px;font-weight:800;letter-spacing:-.5px}
.header .sub{font-size:16px;font-weight:300;color:#bae6fd;margin-top:2px}
.header-right{text-align:right}
.header .date{font-size:13px;color:#93c5fd}
.header .live-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(16,185,129,.2);border:1px solid rgba(16,185,129,.4);color:#6ee7b7;font-size:11px;font-weight:600;padding:4px 12px;border-radius:20px;margin-top:6px}
.live-dot{width:7px;height:7px;background:#10b981;border-radius:50%;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

.container{max-width:1400px;margin:0 auto;padding:32px 48px 48px}

/* KPI Row */
.kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:28px}
.kpi{border-radius:16px;padding:22px 18px;text-align:center;position:relative;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.06);border:1px solid rgba(0,0,0,.04)}
.kpi::before{content:'';position:absolute;top:0;left:0;right:0;height:4px}
.kpi-total{background:linear-gradient(135deg,#eff6ff,#e0f2fe)}.kpi-total::before{background:linear-gradient(90deg,#3b82f6,#0ea5e9)}
.kpi-filled{background:linear-gradient(135deg,#ecfdf5,#d1fae5)}.kpi-filled::before{background:linear-gradient(90deg,#10b981,#34d399)}
.kpi-pending{background:linear-gradient(135deg,#fef2f2,#fce7f3)}.kpi-pending::before{background:linear-gradient(90deg,#ef4444,#f87171)}
.kpi-pct{background:linear-gradient(135deg,#f5f3ff,#ede9fe)}.kpi-pct::before{background:linear-gradient(90deg,#8b5cf6,#6366f1)}
.kpi .number{font-size:36px;font-weight:900;letter-spacing:-2px;line-height:1}
.kpi-total .number{color:#2563eb}.kpi-filled .number{color:#059669}.kpi-pending .number{color:#dc2626}.kpi-pct .number{color:#7c3aed}
.kpi .klabel{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:1.5px;color:#64748b;margin-top:6px}

/* Progress Bar */
.progress-section{margin-bottom:32px}
.progress-header{display:flex;justify-content:space-between;margin-bottom:6px;font-size:13px;font-weight:600;color:#475569}
.progress-bar{height:28px;background:#e2e8f0;border-radius:14px;overflow:hidden;position:relative}
.progress-fill{height:100%;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;transition:width 1.5s ease;background:linear-gradient(90deg,#059669,#10b981,#34d399)}

/* Section Title */
.section-title{font-size:20px;font-weight:700;color:#0f172a;margin:32px 0 16px;display:flex;align-items:center;gap:10px}
.section-title .icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px}

/* Certification Gauge */
.cert-gauge-container{background:#fff;border-radius:20px;padding:32px;margin-bottom:32px;border:1px solid #e2e8f0;box-shadow:0 2px 8px rgba(0,0,0,.04)}
.cert-gauge-grid{display:grid;grid-template-columns:280px 1fr;gap:32px;align-items:center}
.gauge-wrap{position:relative;width:220px;height:130px;margin:0 auto}
.gauge-bg{fill:none;stroke:#e2e8f0;stroke-width:18;stroke-linecap:round}
.gauge-fill{fill:none;stroke-width:18;stroke-linecap:round;transition:stroke-dashoffset 1.5s ease}
.gauge-text{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);text-align:center}
.gauge-text .big{font-size:42px;font-weight:900;line-height:1}
.gauge-text .small{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:1px;color:#64748b}
.cert-layers{display:flex;flex-direction:column;gap:14px}
.cert-layer{display:flex;align-items:center;gap:14px;padding:14px 18px;border-radius:12px;background:#f8fafc;border:1px solid #e2e8f0}
.cert-layer-icon{width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;color:#fff;flex-shrink:0}
.cert-layer-info{flex:1}
.cert-layer-name{font-size:13px;font-weight:700;color:#0f172a}
.cert-layer-desc{font-size:11px;color:#64748b}
.cert-layer-bar{height:8px;background:#e2e8f0;border-radius:4px;margin-top:6px;overflow:hidden}
.cert-layer-fill{height:100%;border-radius:4px;transition:width 1s ease}
.cert-layer-pct{font-size:22px;font-weight:900;flex-shrink:0;min-width:60px;text-align:right}

/* IExperts Review Breakdown */
.ie-breakdown{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:28px}
.ie-stat{text-align:center;padding:16px 10px;border-radius:14px;border:1px solid #e2e8f0}
.ie-stat .ie-num{font-size:28px;font-weight:900;line-height:1}
.ie-stat .ie-label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:1px;color:#64748b;margin-top:4px}

/* Roadmap */
.roadmap{background:#fff;border-radius:20px;padding:28px 32px;margin-bottom:32px;border:1px solid #e2e8f0;box-shadow:0 2px 8px rgba(0,0,0,.04)}
.roadmap-phases{display:flex;gap:0;position:relative;margin-top:16px}
.roadmap-line{position:absolute;top:28px;left:40px;right:40px;height:4px;background:#e2e8f0;border-radius:2px;z-index:0}
.roadmap-line-fill{height:100%;border-radius:2px;background:linear-gradient(90deg,#10b981,#3b82f6);transition:width 1s ease}
.phase{flex:1;position:relative;z-index:1;text-align:center;padding:0 8px}
.phase-dot{width:56px;height:56px;border-radius:50%;margin:0 auto;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800;border:4px solid #e2e8f0;background:#fff;color:#94a3b8;transition:all .3s}
.phase-dot.done{background:#10b981;border-color:#10b981;color:#fff}
.phase-dot.active{background:#fff;border-color:#3b82f6;color:#3b82f6;box-shadow:0 0 0 6px rgba(59,130,246,.15)}
.phase-dot.upcoming{background:#fff;border-color:#e2e8f0;color:#cbd5e1}
.phase-name{font-size:12px;font-weight:700;color:#0f172a;margin-top:10px;line-height:1.3}
.phase-dates{font-size:10px;color:#94a3b8;margin-top:3px}
.phase-pct{font-size:11px;font-weight:700;margin-top:4px;padding:2px 10px;border-radius:10px;display:inline-block}
.phase-pct.done-pct{background:#d1fae5;color:#059669}
.phase-pct.active-pct{background:#dbeafe;color:#2563eb}
.phase-pct.upcoming-pct{background:#f1f5f9;color:#94a3b8}
.phase-tag{position:absolute;top:-22px;left:50%;transform:translateX(-50%);background:#3b82f6;color:#fff;font-size:9px;font-weight:700;letter-spacing:1px;text-transform:uppercase;padding:3px 10px;border-radius:10px;white-space:nowrap}

/* Requirement Grid */
.req-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:32px}
.req-card{background:#fff;border-radius:14px;padding:16px 18px;border:1px solid #e2e8f0;box-shadow:0 1px 3px rgba(0,0,0,.04);transition:transform .15s,box-shadow .15s}
.req-card:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.08)}
.req-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.req-badge{font-size:11px;font-weight:700;color:#fff;border-radius:6px;padding:3px 10px}
.req-pct{font-size:20px;font-weight:800}
.req-name{font-size:12px;font-weight:500;color:#475569;margin-bottom:8px;line-height:1.3}
.req-bar-bg{height:8px;background:#e2e8f0;border-radius:4px;overflow:hidden}
.req-bar-fill{height:100%;border-radius:4px;transition:width 1s ease}
.req-meta{display:flex;justify-content:space-between;margin-top:6px;font-size:10px;color:#94a3b8}
.req-ie-row{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap}
.req-ie-tag{font-size:9px;font-weight:600;padding:2px 6px;border-radius:4px}

/* Colors */
.c-green{color:#059669}.bg-green{background:linear-gradient(90deg,#059669,#34d399)}.badge-green{background:#059669}
.c-blue{color:#2563eb}.bg-blue{background:linear-gradient(90deg,#2563eb,#60a5fa)}.badge-blue{background:#2563eb}
.c-amber{color:#d97706}.bg-amber{background:linear-gradient(90deg,#d97706,#fbbf24)}.badge-amber{background:#d97706}
.c-red{color:#dc2626}.bg-red{background:linear-gradient(90deg,#dc2626,#f87171)}.badge-red{background:#dc2626}

/* Owner Cards */
.owner-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:32px}
.owner-card{background:#fff;border-radius:14px;padding:18px;border:1px solid #e2e8f0;position:relative;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.owner-card::before{content:'';position:absolute;top:0;left:0;right:0;height:4px}
.owner-card:nth-child(1)::before{background:linear-gradient(90deg,#3b82f6,#6366f1)}
.owner-card:nth-child(2)::before{background:linear-gradient(90deg,#8b5cf6,#a855f7)}
.owner-card:nth-child(3)::before{background:linear-gradient(90deg,#10b981,#14b8a6)}
.owner-card:nth-child(4)::before{background:linear-gradient(90deg,#f59e0b,#f97316)}
.owner-name{font-size:14px;font-weight:700;color:#0f172a}
.owner-role{font-size:11px;color:#64748b;margin-bottom:8px}
.owner-reqs{font-size:11px;color:#475569;margin-bottom:8px}
.owner-stats{display:flex;justify-content:space-between;align-items:flex-end}
.owner-pct{font-size:26px;font-weight:900;line-height:1}
.owner-detail{font-size:10px;color:#94a3b8;text-align:right}

/* Critical Alert */
.critical-alert{background:linear-gradient(135deg,#fef2f2,#fff1f2);border:2px solid #fca5a5;border-radius:16px;padding:24px 28px;margin:28px 0;position:relative;overflow:hidden}
.critical-alert::before{content:'';position:absolute;left:0;top:0;bottom:0;width:6px;background:linear-gradient(180deg,#dc2626,#ef4444);border-radius:16px 0 0 16px}
.alert-header{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.alert-badge{background:#dc2626;color:#fff;font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;padding:5px 14px;border-radius:6px}
.alert-title{font-size:16px;font-weight:700;color:#991b1b}
.critical-alert p{font-size:13px;color:#7f1d1d;margin-bottom:8px;line-height:1.6}
.service-tags{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.service-tag{background:#fecaca;color:#991b1b;font-size:11px;font-weight:600;padding:4px 14px;border-radius:20px}

/* Auto-refresh indicator */
.refresh-bar{position:fixed;top:0;left:0;right:0;height:3px;z-index:999}
.refresh-bar .fill{height:100%;background:linear-gradient(90deg,#3b82f6,#06b6d4,#10b981);width:0;transition:width linear}

@media(max-width:900px){
  .kpi-row,.owner-grid{grid-template-columns:repeat(2,1fr)}
  .req-grid{grid-template-columns:1fr 1fr}
  .ie-breakdown{grid-template-columns:repeat(3,1fr)}
  .cert-gauge-grid{grid-template-columns:1fr}
  .roadmap-phases{flex-wrap:wrap}
  .container,.header{padding-left:24px;padding-right:24px}
}
@media(max-width:600px){
  .kpi-row,.owner-grid,.req-grid{grid-template-columns:1fr}
  .ie-breakdown{grid-template-columns:repeat(2,1fr)}
}
@media print{
  body{background:#fff}
  .refresh-bar{display:none}
  .header{padding:24px 32px 20px}
  .container{padding:20px 32px}
}
</style>
</head>
<body>

<div class="refresh-bar"><div class="fill" id="refreshFill"></div></div>

<div class="header">
  <div class="header-inner">
    <div class="header-left">
      <div class="label">CEO Executive Dashboard</div>
      <h1>PCI DSS v4.0.1 Compliance</h1>
      <div class="sub">TRU &mdash; Evidence Collection &amp; Certification Tracker</div>
    </div>
    <div class="header-right">
      <div class="date" id="dateDisplay"></div>
      <div class="live-badge"><span class="live-dot"></span> Live Data</div>
    </div>
  </div>
</div>

<div class="container" id="app">
  <p style="text-align:center;padding:80px 0;color:#94a3b8">Loading dashboard data...</p>
</div>

<script>
const DATA = __DATA_PLACEHOLDER__;

function pctClass(p) {
  if (p === 100) return 'green';
  if (p >= 70) return 'blue';
  if (p >= 50) return 'amber';
  return 'red';
}

const OWNERS_META = {
  'Amr Abdelnasr': { role: 'IT Infrastructure', reqs: [1,2,4,5] },
  'Tamer Sherif': { role: 'App Development', reqs: [3,6,8] },
  'Ahmad Sayed': { role: 'Cyber Force / SOC', reqs: [9,10,11] },
  'Yasser Shishiny': { role: 'Project Lead', reqs: [7,12] }
};

function render() {
  const d = DATA;
  const s = d.summary;
  const reqs = d.requirements;

  document.getElementById('dateDisplay').textContent = new Date().toLocaleDateString('en-US', { weekday:'long', year:'numeric', month:'long', day:'numeric' });

  let h = '';

  // ===== CERTIFICATION READINESS GAUGE =====
  h += '<div class="cert-gauge-container">';
  h += '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">';
  h += '<div><div style="font-size:11px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:#64748b">Certification Readiness</div>';
  h += '<div style="font-size:22px;font-weight:800;color:#0f172a;margin-top:2px">Where We Stand</div></div>';
  h += '<div style="font-size:12px;color:#64748b;text-align:right">Target: <strong style="color:#dc2626">May 15, 2026</strong><br>Original: June 1, 2026</div>';
  h += '</div>';

  // Compute overall certification readiness: weighted average of three layers
  // Layer 1 (TRU Upload) = 30% weight, Layer 2 (IExperts Audit) = 40%, Layer 3 (Assessor) = 30%
  var truPct = s.percentage;
  var auditPct = s.ieApprovedPct;
  var assessorPct = 0; // not started
  var certReadiness = Math.round(truPct * 0.3 + auditPct * 0.4 + assessorPct * 0.3);

  h += '<div class="cert-gauge-grid">';
  // SVG gauge
  var arcLen = 251; // half circle path length for r=80
  var offset = arcLen - (arcLen * certReadiness / 100);
  var gaugeColor = certReadiness >= 60 ? '#10b981' : certReadiness >= 35 ? '#f59e0b' : '#ef4444';
  h += '<div class="gauge-wrap">';
  h += '<svg viewBox="0 0 200 110" width="220" height="130">';
  h += '<path d="M20,100 A80,80 0 0,1 180,100" class="gauge-bg"/>';
  h += '<path d="M20,100 A80,80 0 0,1 180,100" class="gauge-fill" style="stroke:'+gaugeColor+';stroke-dasharray:'+arcLen+';stroke-dashoffset:'+offset+'"/>';
  h += '</svg>';
  h += '<div class="gauge-text"><div class="big" style="color:'+gaugeColor+'">'+certReadiness+'%</div><div class="small">Cert Ready</div></div>';
  h += '</div>';

  // Three layers
  h += '<div class="cert-layers">';
  // Layer 1: TRU Upload
  h += '<div class="cert-layer">';
  h += '<div class="cert-layer-icon" style="background:linear-gradient(135deg,#3b82f6,#0ea5e9)">1</div>';
  h += '<div class="cert-layer-info"><div class="cert-layer-name">TRU Evidence Upload</div>';
  h += '<div class="cert-layer-desc">'+s.filledEPs+'/'+s.totalEPs+' evidence points submitted by TRU team</div>';
  h += '<div class="cert-layer-bar"><div class="cert-layer-fill" style="width:'+truPct+'%;background:linear-gradient(90deg,#3b82f6,#0ea5e9)"></div></div></div>';
  h += '<div class="cert-layer-pct" style="color:#2563eb">'+truPct+'%</div></div>';
  // Layer 2: IExperts Audit
  h += '<div class="cert-layer">';
  h += '<div class="cert-layer-icon" style="background:linear-gradient(135deg,#10b981,#34d399)">2</div>';
  h += '<div class="cert-layer-info"><div class="cert-layer-name">IExperts Audit Review</div>';
  h += '<div class="cert-layer-desc">'+(s.ieApproved)+' approved, '+(s.ieNeedReview||0)+' need revision, '+(s.ieRejected||0)+' rejected</div>';
  h += '<div class="cert-layer-bar"><div class="cert-layer-fill" style="width:'+auditPct+'%;background:linear-gradient(90deg,#10b981,#34d399)"></div></div></div>';
  h += '<div class="cert-layer-pct" style="color:#059669">'+auditPct+'%</div></div>';
  // Layer 3: Assessor
  h += '<div class="cert-layer">';
  h += '<div class="cert-layer-icon" style="background:linear-gradient(135deg,#8b5cf6,#a855f7)">3</div>';
  h += '<div class="cert-layer-info"><div class="cert-layer-name">QSA Assessor Acceptance</div>';
  h += '<div class="cert-layer-desc">Final certification audit &mdash; pending pre-audit completion</div>';
  h += '<div class="cert-layer-bar"><div class="cert-layer-fill" style="width:0%;background:linear-gradient(90deg,#8b5cf6,#a855f7)"></div></div></div>';
  h += '<div class="cert-layer-pct" style="color:#8b5cf6">0%</div></div>';
  h += '</div></div></div>';

  // ===== KPI CARDS =====
  h += '<div class="kpi-row">';
  h += '<div class="kpi kpi-total"><div class="number">'+s.totalEPs+'</div><div class="klabel">Total Evidence</div></div>';
  h += '<div class="kpi kpi-filled"><div class="number">'+s.filledEPs+'</div><div class="klabel">TRU Submitted</div></div>';
  h += '<div class="kpi kpi-pending"><div class="number">'+s.emptyEPs+'</div><div class="klabel">Pending Upload</div></div>';
  h += '<div class="kpi kpi-pct"><div class="number">'+s.percentage+'%</div><div class="klabel">TRU Complete</div></div>';
  h += '</div>';

  // ===== IEXPERTS REVIEW BREAKDOWN =====
  h += '<div class="section-title"><div class="icon" style="background:#ecfdf5;color:#10b981">\u{1F50D}</div>IExperts Audit Review Breakdown</div>';
  h += '<div class="ie-breakdown">';
  h += '<div class="ie-stat" style="background:#ecfdf5;border-color:#a7f3d0"><div class="ie-num" style="color:#059669">'+(s.ieApproved||0)+'</div><div class="ie-label">Approved</div></div>';
  h += '<div class="ie-stat" style="background:#fef3c7;border-color:#fde68a"><div class="ie-num" style="color:#d97706">'+(s.ieNeedReview||0)+'</div><div class="ie-label">Need Review</div></div>';
  h += '<div class="ie-stat" style="background:#fef2f2;border-color:#fecaca"><div class="ie-num" style="color:#dc2626">'+(s.ieRejected||0)+'</div><div class="ie-label">Rejected</div></div>';
  h += '<div class="ie-stat" style="background:#f8fafc;border-color:#e2e8f0"><div class="ie-num" style="color:#94a3b8">'+(s.ieNA||0)+'</div><div class="ie-label">N/A</div></div>';
  h += '<div class="ie-stat" style="background:#f1f5f9;border-color:#cbd5e1"><div class="ie-num" style="color:#64748b">'+(s.ieNotReviewed||0)+'</div><div class="ie-label">Not Reviewed</div></div>';
  h += '</div>';

  // Progress bars
  h += '<div class="progress-section">';
  h += '<div class="progress-header"><span>TRU Evidence Upload</span><span>'+s.filledEPs+' / '+s.totalEPs+'</span></div>';
  h += '<div class="progress-bar"><div class="progress-fill" style="width:'+s.percentage+'%">'+s.percentage+'%</div></div>';
  h += '<div class="progress-header" style="margin-top:10px"><span>IExperts Audit Approved</span><span>'+(s.ieApproved||0)+' / '+s.totalEPs+'</span></div>';
  h += '<div class="progress-bar"><div class="progress-fill" style="width:'+(s.ieApprovedPct||0)+'%;background:linear-gradient(90deg,#10b981,#34d399)">'+(s.ieApprovedPct||0)+'%</div></div>';
  h += '<div class="progress-header" style="margin-top:10px"><span>IExperts Reviewed (any status)</span><span>'+(s.ieReviewed||0)+' / '+s.totalEPs+'</span></div>';
  var reviewedPct = s.totalEPs > 0 ? Math.round(((s.ieReviewed||0)/s.totalEPs)*100) : 0;
  h += '<div class="progress-bar"><div class="progress-fill" style="width:'+reviewedPct+'%;background:linear-gradient(90deg,#6366f1,#8b5cf6)">'+reviewedPct+'%</div></div>';
  h += '</div>';

  // ===== IEXPERTS ROADMAP (5 Phases) =====
  h += '<div class="roadmap">';
  h += '<div style="display:flex;justify-content:space-between;align-items:center">';
  h += '<div style="font-size:18px;font-weight:800;color:#0f172a">\u{1F5FA}\uFE0F IExperts Certification Roadmap</div>';
  h += '<div style="font-size:11px;color:#64748b">Crash Target: <strong style="color:#dc2626">May 15</strong> | Original: June 1</div>';
  h += '</div>';

  var phases = [
    { num: 1, name: 'Kick-off & Gap Assessment', dates: 'Mar 12 \u2013 Mar 26', pct: 100, status: 'done' },
    { num: 2, name: 'Gap Remediation & Evidence', dates: 'Mar 29 \u2013 Apr 19', pct: Math.round((s.percentage * 0.5 + reviewedPct * 0.5)), status: 'active' },
    { num: 3, name: 'IExperts Supporting', dates: 'Apr 5 \u2013 Apr 12', pct: 0, status: 'upcoming',
      desc: 'SAT, Policies/TRA, Segmentation PT' },
    { num: 4, name: 'Pre-Audit', dates: 'Apr 14 \u2013 Apr 29', pct: 0, status: 'upcoming',
      desc: 'Audit sim, ASV scan, QSA upload' },
    { num: 5, name: 'Final Audit & Deliverables', dates: 'Apr 30 \u2013 Jun 1', pct: 0, status: 'upcoming',
      desc: 'Audit, findings, AOC/ROC/COC' }
  ];

  // Roadmap line fill percentage (phase 1 done = 20%, active phase 2 partial)
  var lineWidth = 20 + (phases[1].pct / 100) * 20;
  h += '<div class="roadmap-phases">';
  h += '<div class="roadmap-line"><div class="roadmap-line-fill" style="width:'+lineWidth+'%"></div></div>';
  for (var i = 0; i < phases.length; i++) {
    var p = phases[i];
    var dotCls = p.status;
    h += '<div class="phase">';
    if (p.status === 'active') h += '<div class="phase-tag">WE ARE HERE</div>';
    h += '<div class="phase-dot '+dotCls+'">'+p.num+'</div>';
    h += '<div class="phase-name">'+p.name+'</div>';
    h += '<div class="phase-dates">'+p.dates+'</div>';
    h += '<div class="phase-pct '+p.status+'-pct">'+p.pct+'%</div>';
    h += '</div>';
  }
  h += '</div></div>';

  // ===== REQUIREMENTS GRID =====
  h += '<div class="section-title"><div class="icon" style="background:#eff6ff;color:#3b82f6">\u{1F4CA}</div>12 PCI DSS Requirements</div>';
  h += '<div class="req-grid">';
  for (var ri = 0; ri < reqs.length; ri++) {
    var r = reqs[ri];
    var cls = pctClass(r.percentage);
    var owner = 'Unassigned';
    for (var oi in OWNERS_META) {
      if (OWNERS_META[oi].reqs.indexOf(r.id) >= 0) { owner = oi.split(' ')[0]; break; }
    }
    h += '<div class="req-card">';
    h += '<div class="req-top"><span class="req-badge badge-'+cls+'">R'+r.id+'</span><span class="req-pct c-'+cls+'">'+r.percentage+'%</span></div>';
    h += '<div class="req-name">'+r.name+'</div>';
    // TRU upload bar
    h += '<div class="req-bar-bg"><div class="req-bar-fill bg-'+cls+'" style="width:'+r.percentage+'%"></div></div>';
    // Audit bar
    var aP = r.iePct || 0;
    h += '<div style="margin-top:4px;font-size:9px;color:#059669;font-weight:600">Audit: '+(r.ieApproved||0)+'/'+r.total+' approved ('+aP+'%)</div>';
    h += '<div class="req-bar-bg" style="height:4px;margin-top:2px"><div class="req-bar-fill" style="width:'+aP+'%;background:#10b981"></div></div>';
    // IE review breakdown tags
    h += '<div class="req-ie-row">';
    if (r.ieApproved > 0) h += '<span class="req-ie-tag" style="background:#d1fae5;color:#059669">'+r.ieApproved+' ok</span>';
    if (r.ieNeedReview > 0) h += '<span class="req-ie-tag" style="background:#fef3c7;color:#d97706">'+r.ieNeedReview+' review</span>';
    if (r.ieRejected > 0) h += '<span class="req-ie-tag" style="background:#fecaca;color:#dc2626">'+r.ieRejected+' rejected</span>';
    if (r.ieNA > 0) h += '<span class="req-ie-tag" style="background:#f1f5f9;color:#94a3b8">'+r.ieNA+' n/a</span>';
    if (r.ieNotReviewed > 0) h += '<span class="req-ie-tag" style="background:#e2e8f0;color:#64748b">'+r.ieNotReviewed+' pending</span>';
    h += '</div>';
    h += '<div class="req-meta"><span>'+r.filled+'/'+r.total+' uploaded</span><span>'+owner+'</span></div>';
    h += '</div>';
  }
  h += '</div>';

  // ===== TEAM PROGRESS =====
  h += '<div class="section-title"><div class="icon" style="background:#f0fdf4;color:#10b981">\u{1F465}</div>Team Progress</div>';
  h += '<div class="owner-grid">';
  for (var name in OWNERS_META) {
    var meta = OWNERS_META[name];
    var ownerReqs = reqs.filter(function(r){ return meta.reqs.indexOf(r.id) >= 0; });
    var filled = ownerReqs.reduce(function(a,r){ return a + r.filled; }, 0);
    var total = ownerReqs.reduce(function(a,r){ return a + r.total; }, 0);
    var ieApp = ownerReqs.reduce(function(a,r){ return a + (r.ieApproved||0); }, 0);
    var pct = total > 0 ? Math.round((filled/total)*100) : 0;
    var aPct = total > 0 ? Math.round((ieApp/total)*100) : 0;
    var cls2 = pctClass(pct);
    h += '<div class="owner-card">';
    h += '<div class="owner-name">'+name+'</div>';
    h += '<div class="owner-role">'+meta.role+'</div>';
    h += '<div class="owner-reqs">Reqs: '+meta.reqs.map(function(r){return 'R'+r;}).join(', ')+'</div>';
    h += '<div class="owner-stats"><div class="owner-pct c-'+cls2+'">'+pct+'%</div><div class="owner-detail">'+filled+'/'+total+' upload<br>'+ieApp+'/'+total+' audit ('+aPct+'%)</div></div>';
    h += '</div>';
  }
  h += '</div>';

  // ===== CRITICAL BLOCKERS =====
  var emptyReqs = reqs.filter(function(r){ return r.empty > 0; });
  if (emptyReqs.length > 0) {
    h += '<div class="critical-alert">';
    h += '<div class="alert-header"><span class="alert-badge">\u26A0 Action Required</span><span class="alert-title">Evidence Gaps Remaining</span></div>';
    h += '<p><strong>'+s.emptyEPs+' evidence points</strong> still need to be uploaded across '+emptyReqs.length+' requirements:</p>';
    h += '<div class="service-tags">';
    for (var ei = 0; ei < emptyReqs.length; ei++) {
      h += '<span class="service-tag">R'+emptyReqs[ei].id+': '+emptyReqs[ei].empty+' missing</span>';
    }
    h += '</div>';
    // Rejected items
    var rejReqs = reqs.filter(function(r){ return r.ieRejected > 0; });
    if (rejReqs.length > 0) {
      h += '<p style="margin-top:8px"><strong style="color:#dc2626">'+rejReqs.reduce(function(a,r){return a+r.ieRejected;},0)+' evidence points rejected by IExperts</strong> \u2014 must be re-submitted with corrections.</p>';
    }
    // Need review items
    var nrTotal = s.ieNeedReview || 0;
    if (nrTotal > 0) {
      h += '<p><strong style="color:#d97706">'+nrTotal+' evidence points need revision</strong> \u2014 IExperts flagged issues that must be addressed.</p>';
    }
    h += '</div>';
  }

  // ===== INFRASTRUCTURE STATUS =====
  h += '<div class="section-title"><div class="icon" style="background:#faf5ff;color:#8b5cf6">\u{1F6E0}\uFE0F</div>Infrastructure Status</div>';
  h += '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:32px">';
  var infra = [
    { name: 'Elastic SIEM', status: 'Installing', color: '#f59e0b', bg: '#fffbeb', icon: '\u{1F6E1}\uFE0F' },
    { name: 'Elastic EDR', status: 'Installing', color: '#f59e0b', bg: '#fffbeb', icon: '\u{1F50D}' },
    { name: 'Kaspersky AV', status: 'Deployed', color: '#10b981', bg: '#ecfdf5', icon: '\u2705' },
    { name: 'Penetration Test', status: 'In Progress', color: '#3b82f6', bg: '#eff6ff', icon: '\u{1F9EA}' },
    { name: 'Log Management', status: 'Installing', color: '#f59e0b', bg: '#fffbeb', icon: '\u{1F4DD}' },
    { name: 'Cyber Force Contract', status: 'Active', color: '#10b981', bg: '#ecfdf5', icon: '\u{1F4DC}' }
  ];
  for (var ii = 0; ii < infra.length; ii++) {
    var inf = infra[ii];
    h += '<div style="background:'+inf.bg+';border:1px solid '+inf.color+'33;border-radius:12px;padding:16px;display:flex;align-items:center;gap:12px">';
    h += '<div style="font-size:24px">'+inf.icon+'</div>';
    h += '<div><div style="font-size:13px;font-weight:700;color:#0f172a">'+inf.name+'</div>';
    h += '<div style="font-size:11px;font-weight:600;color:'+inf.color+'">'+inf.status+'</div></div>';
    h += '</div>';
  }
  h += '</div>';

  // Footer
  h += '<div style="text-align:center;padding:24px 0;border-top:1px solid #e2e8f0;font-size:12px;color:#94a3b8">';
  h += '<strong>TRU PCI DSS v4.0.1</strong> &mdash; Confidential &mdash; Auto-refreshes every 60s<br>';
  h += 'Prepared by Yasser Shishiny, Project Lead | IExperts PM: Mohamed El Gazar';
  h += '</div>';

  document.getElementById('app').innerHTML = h;
}

render();

// Auto-refresh every 60s
var refreshTimer = 0;
var REFRESH_INTERVAL = 60;
function tickRefresh() {
  refreshTimer++;
  var pct = (refreshTimer / REFRESH_INTERVAL) * 100;
  document.getElementById('refreshFill').style.width = pct + '%';
  document.getElementById('refreshFill').style.transitionDuration = '1s';
  if (refreshTimer >= REFRESH_INTERVAL) {
    refreshTimer = 0;
    location.reload();
  }
}
setInterval(tickRefresh, 1000);
</script>
</body>
</html>
