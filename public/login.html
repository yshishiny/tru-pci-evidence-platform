<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TRU PCI DSS — Sign In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0f172a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #e2e8f0;
      overflow: hidden;
    }

    /* Animated background */
    .bg-grid {
      position: fixed; inset: 0; z-index: 0;
      background-image:
        linear-gradient(rgba(59,130,246,0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(59,130,246,0.05) 1px, transparent 1px);
      background-size: 40px 40px;
    }
    .bg-glow {
      position: fixed; z-index: 0;
      width: 600px; height: 600px; border-radius: 50%;
      background: radial-gradient(circle, rgba(59,130,246,0.15) 0%, transparent 70%);
      top: -200px; right: -200px;
      animation: pulse 8s ease-in-out infinite;
    }
    .bg-glow-2 {
      position: fixed; z-index: 0;
      width: 400px; height: 400px; border-radius: 50%;
      background: radial-gradient(circle, rgba(139,92,246,0.1) 0%, transparent 70%);
      bottom: -100px; left: -100px;
      animation: pulse 10s ease-in-out infinite reverse;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.5; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.1); }
    }

    .login-wrapper {
      position: relative; z-index: 1;
      width: 100%; max-width: 420px; padding: 20px;
    }

    .login-card {
      background: rgba(30, 41, 59, 0.8);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(59, 130, 246, 0.2);
      border-radius: 16px;
      padding: 40px 36px;
      box-shadow: 0 25px 60px rgba(0,0,0,0.4), 0 0 40px rgba(59,130,246,0.05);
    }

    .logo-section {
      text-align: center;
      margin-bottom: 32px;
    }

    .logo-icon {
      width: 56px; height: 56px;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      border-radius: 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      font-weight: 800;
      color: #fff;
      letter-spacing: -0.5px;
      margin-bottom: 16px;
      box-shadow: 0 8px 24px rgba(59,130,246,0.3);
    }

    .logo-title {
      font-size: 20px;
      font-weight: 700;
      color: #f1f5f9;
      margin-bottom: 4px;
    }

    .logo-subtitle {
      font-size: 13px;
      color: #94a3b8;
      font-weight: 400;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: #94a3b8;
      margin-bottom: 6px;
    }

    .form-input {
      width: 100%;
      padding: 12px 14px;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 10px;
      color: #e2e8f0;
      font-size: 14px;
      font-family: inherit;
      transition: all 0.2s ease;
      outline: none;
    }
    .form-input:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59,130,246,0.15);
      background: rgba(15, 23, 42, 0.8);
    }
    .form-input::placeholder { color: #475569; }

    .error-message {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 13px;
      color: #fca5a5;
      margin-bottom: 16px;
      display: none;
      align-items: center;
      gap: 8px;
    }
    .error-message.visible { display: flex; }
    .error-icon { font-size: 16px; flex-shrink: 0; }

    .login-button {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      border: none;
      border-radius: 10px;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px rgba(37,99,235,0.3);
    }
    .login-button:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(37,99,235,0.4);
    }
    .login-button:active:not(:disabled) {
      transform: translateY(0);
    }
    .login-button:disabled {
      opacity: 0.6; cursor: not-allowed;
    }

    .security-badge {
      text-align: center;
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid rgba(148, 163, 184, 0.1);
    }
    .security-badge span {
      font-size: 11px;
      color: #64748b;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .shield-icon {
      font-size: 14px;
    }

    .footer-text {
      text-align: center;
      margin-top: 20px;
      font-size: 12px;
      color: #475569;
    }

    /* Loading spinner */
    .spinner {
      display: inline-block;
      width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      margin-right: 8px;
      vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="bg-grid"></div>
  <div class="bg-glow"></div>
  <div class="bg-glow-2"></div>

  <div class="login-wrapper">
    <div class="login-card">
      <div class="logo-section">
        <div class="logo-icon">TRU</div>
        <div class="logo-title">PCI DSS Evidence Platform</div>
        <div class="logo-subtitle">Secure access to compliance portals</div>
      </div>

      <form id="loginForm" autocomplete="off">
        <div class="error-message" id="errorMsg">
          <span class="error-icon">&#9888;</span>
          <span id="errorText"></span>
        </div>

        <div class="form-group">
          <label class="form-label">Username</label>
          <input type="text" id="username" class="form-input" placeholder="Enter your username" required autofocus>
        </div>

        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" id="password" class="form-input" placeholder="Enter your password" required>
        </div>

        <button type="submit" class="login-button" id="loginBtn">Sign In</button>
      </form>

      <div class="security-badge">
        <span><span class="shield-icon">&#128274;</span> Protected by TRU Security — PCI DSS v4.0.1</span>
      </div>
    </div>

    <div class="footer-text">
      TRU Compliance Portal &copy; 2026
    </div>
  </div>

  <script>
    (function() {
      const form = document.getElementById('loginForm');
      const errorMsg = document.getElementById('errorMsg');
      const errorText = document.getElementById('errorText');
      const loginBtn = document.getElementById('loginBtn');

      // Get redirect target from URL params
      const params = new URLSearchParams(window.location.search);
      const redirectTo = params.get('redirect') || '/command-center';

      form.addEventListener('submit', async function(e) {
        e.preventDefault();

        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;

        if (!username || !password) {
          showError('Please enter both username and password.');
          return;
        }

        // Disable button
        loginBtn.disabled = true;
        loginBtn.innerHTML = '<span class="spinner"></span>Signing in...';
        errorMsg.classList.remove('visible');

        try {
          const resp = await fetch('/api/portal/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
          });

          const data = await resp.json();

          if (!resp.ok) {
            throw new Error(data.error || 'Authentication failed');
          }

          // Success — cookie is set by server, redirect
          window.location.href = redirectTo;

        } catch (err) {
          showError(err.message || 'Login failed. Please check your credentials.');
          loginBtn.disabled = false;
          loginBtn.textContent = 'Sign In';
        }
      });

      function showError(msg) {
        errorText.textContent = msg;
        errorMsg.classList.add('visible');
      }

      // If already authenticated, redirect
      fetch('/api/portal/verify', { credentials: 'same-origin' })
        .then(r => r.json())
        .then(d => {
          if (d.authenticated) window.location.href = redirectTo;
        })
        .catch(() => {});
    })();
  </script>
</body>
</html>
